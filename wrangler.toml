# Static site output: run `npm run build` first so ./dist exists.
# https://developers.cloudflare.com/workers/wrangler/configuration/
#
# - **`wrangler deploy`** (e.g. CI still using this): requires `[assets]` below or it errors.
# - **Cloudflare Pages (recommended):** `npm run deploy` → `wrangler pages deploy dist` — use this in
#   the dashboard so you do not deploy a separate Worker.
# - **`pages_build_output_dir`**: hints/tools that this folder is the Pages build output.

# Must match the Workers/Pages project slug in Cloudflare (CI derives e.g. mw4-cheat--app from the repo name).
name = "mw4-cheat--app"
compatibility_date = "2025-11-06"
pages_build_output_dir = "dist"

[assets]
directory = "./dist"
